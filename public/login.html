<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - RentRead</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="container mx-auto p-6">
      <h2 class="text-2xl font-bold">Login</h2>
      <form id="loginForm" class="mt-4 max-w-md">
        <input name="email" placeholder="Email" class="w-full p-2 mb-2 border" />
        <input name="password" type="password" placeholder="Password" class="w-full p-2 mb-2 border" />
        <button class="px-4 py-2 bg-blue-600 text-white rounded">Login</button>
      </form>
      <p class="mt-4">New? <a href="/public/register.html" class="text-blue-600">Register</a></p>
    </div>

    <script>
      // Check if there's a pending rental
      const pendingRental = sessionStorage.getItem('pendingRental');
      
      if (pendingRental) {
        const rental = JSON.parse(pendingRental);
        const notice = document.createElement('div');
        notice.className = 'bg-blue-50 border border-blue-200 rounded p-4 mb-4';
        notice.innerHTML = `
          <h3 class="font-semibold text-blue-800">Complete Your Book Rental</h3>
          <p class="text-blue-600">Book: ${rental.bookTitle}</p>
          <p class="text-blue-600">Duration: ${rental.days} days</p>
          <p class="text-blue-600">Total: ৳${rental.totalPrice}</p>
          <p class="text-sm text-blue-500 mt-2">Login to complete this rental</p>
        `;
        document.querySelector('.container').insertBefore(notice, document.querySelector('h2'));
      }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = { email: fd.get('email'), password: fd.get('password') };
        
        try {
          const res = await fetch('/api/auth/login', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(body)
          });
          const data = await res.json();
          
          if (data.success && data.token) {
            localStorage.setItem('token', data.token);
            
            // Process pending rental if exists
            if (pendingRental) {
              const rental = JSON.parse(pendingRental);
              
              const rentRes = await fetch('/api/rent-book', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${data.token}`
                },
                body: JSON.stringify(rental)
              });
              
              const rentData = await rentRes.json();
              
              if (rentData.success) {
                sessionStorage.removeItem('pendingRental');
                alert(`Login successful! Book "${rental.bookTitle}" rented for ${rental.days} days.`);
                window.location = '/public/dashboard.html';
              } else {
                alert('Login successful but rental failed. Please try renting again.');
                window.location = '/public/index.html';
              }
            } else {
              alert('Login successful!');
              window.location = '/public/dashboard.html';
            }
          } else {
            alert(data.message || 'Login failed');
          }
        } catch (error) {
          console.error('Login error:', error);
          alert('Login failed. Please try again.');
        }
      });
    </script>
  </body>
</html>
