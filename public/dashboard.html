<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Dashboard • RentRead</title>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Header / Topbar -->
  <header class="topbar">
    <div class="container row between">
      <a class="brand" href="/">
        <div class="brand-logo">
          <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <!-- Background circle -->
            <circle cx="20" cy="20" r="18" fill="#4F46E5" stroke="#3730A3" stroke-width="2"/>
            
            <!-- Book icon -->
            <rect x="12" y="14" width="16" height="12" rx="1" fill="#FFFFFF"/>
            <rect x="12" y="14" width="3" height="12" fill="#E5E7EB"/>
            <line x1="17" y1="17" x2="26" y2="17" stroke="#9CA3AF" stroke-width="1"/>
            <line x1="17" y1="19" x2="24" y2="19" stroke="#9CA3AF" stroke-width="1"/>
            <line x1="17" y1="21" x2="26" y2="21" stroke="#9CA3AF" stroke-width="1"/>
            <line x1="17" y1="23" x2="25" y2="23" stroke="#9CA3AF" stroke-width="1"/>
            
            <!-- Rent arrow -->
            <circle cx="28" cy="12" r="4" fill="#10B981"/>
            <path d="M26 12 L28 10 L28 11 L30 11 L30 13 L28 13 L28 14 Z" fill="white"/>
            
            <!-- RR text -->
            <text x="20" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#4F46E5">RR</text>
          </svg>
        </div>
        <div>
          <h1>RentRead</h1>
          <small>Read more • Spend less</small>
        </div>
      </a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/dashboard.html" class="active">Dashboard</a>
        <a href="/my_rental.html">My Rentals</a>
        <a href="/contact.html">Contact</a>
      </nav>
      <div class="actions">
        <div class="theme-selector">
          <button class="btn" id="toggleTheme" aria-label="Choose theme">🎨 Themes</button>
          <div class="theme-dropdown" id="themeDropdown">
            <button class="theme-option" data-theme="light">☀️ Light</button>
            <button class="theme-option" data-theme="dark">🌙 Dark</button>
            <button class="theme-option" data-theme="ocean">🌊 Ocean</button>
            <button class="theme-option" data-theme="forest">🌲 Forest</button>
            <button class="theme-option" data-theme="sunset">🌅 Sunset</button>
            <button class="theme-option" data-theme="purple">💜 Purple</button>
            <button class="theme-option" data-theme="rose">🌹 Rose</button>
            <button class="theme-option" data-theme="midnight">🌌 Midnight</button>
            <button class="theme-option" data-theme="galaxy">🌠 Galaxy</button>
            <button class="theme-option" data-theme="gold">🏆 Gold</button>
            <button class="theme-option" data-theme="cyber">⚡ Cyber</button>
            <button class="theme-option" data-theme="cherry">🍒 Cherry</button>
            <button class="theme-option" data-theme="sky">☁️ Sky</button>
            <button class="theme-option" data-theme="emerald">💎 Emerald</button>
            <button class="theme-option" data-theme="lavender">🪻 Lavender</button>
             <button class="theme-option" data-theme="black">⚫ Black</button>
            <button class="theme-option" data-theme="red">🔴 Red</button>
            <button class="theme-option" data-theme="pink">🎀 Pink</button>
          </div>
        </div>
        <div id="authActions">
          <button class="btn-secondary" id="btnLogout">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Dashboard Hero -->
  <section class="hero" style="padding: 40px 0;">
    <div class="container">
      <div class="hero-card">
        <div>
          <h2 id="welcomeMessage">My Library</h2>
          <p>Manage your rented books and discover new titles to read.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="container" style="padding-bottom: 60px;">
    <!-- Available Books Section -->
    <section>
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; color: var(--text);">🔍 Available Books</h2>
      <div id="available" class="grid"></div>
    </section>
  </main>

  <!-- Rent modal (matching index.html) -->
  <div class="rr-modal-backdrop" id="rentModal">
    <div class="rr-modal" role="dialog" aria-modal="true" aria-labelledby="rentTitle">
      <h3 id="rentTitle">Rent Book</h3>
      <div id="rentBookInfo" style="margin-bottom:12px;color:var(--muted)"></div>

      <!-- Days selector + live price for the simple modal (keeps old pink look) -->
      <div style="margin-bottom:10px;">
        <label for="rentDays">Days to rent (1-30)</label>
        <div style="display:flex; align-items:center; gap:12px; margin-top:8px;">
          <input id="rr_rentDays" type="number" min="1" max="30" value="1" style="width:80px; padding:8px; border-radius:6px; border:1px solid #e6e6e6;" />
          <div style="font-weight:700; color:var(--accent); font-size:1.05rem;">Total: <span id="rrTotalPrice">৳0</span></div>
        </div>
        <div id="rrPriceBreakdown" style="margin-top:8px; color:var(--muted); font-size:0.9rem"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" id="rentCancel">Cancel</button>
        <button class="btn-confirm" id="rentConfirm">Rent & Confirm</button>
      </div>
    </div>
  </div>

    <script src="auth.js"></script>
    <script>
      // Theme Toggle System (matching index.html)
      const toggleBtn = document.getElementById('toggleTheme');
      const dropdown = document.getElementById('themeDropdown');
      const themeOptions = document.querySelectorAll('.theme-option');

      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('show');
      });

      document.addEventListener('click', () => {
        dropdown.classList.remove('show');
      });

      themeOptions.forEach(option => {
        option.addEventListener('click', (e) => {
          e.stopPropagation();
          const theme = option.dataset.theme;
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem('theme', theme);
          dropdown.classList.remove('show');
        });
      });

      // Load saved theme
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);

      // Check authentication on page load
      document.addEventListener('DOMContentLoaded', async () => {
        try {
          const isAuthenticated = await authManager.checkAuth();
          if (!isAuthenticated) {
            showNotification('Please sign in to access your dashboard', 'warning');
            setTimeout(() => {
              window.location.href = 'signin.html';
            }, 2000);
            return;
          }
          
          // Get user profile
          const profile = await authManager.getUserProfile();
          if (profile && profile.username) {
            document.getElementById('welcomeMessage').textContent = `Welcome back, ${profile.username}! 📚`;
          }
          
          // Load dashboard data
          await loadDashboard();
        } catch (error) {
          console.error('Dashboard load failed:', error);
          showNotification('Failed to load dashboard', 'error');
        }
      });

      // Handle logout
      document.getElementById('btnLogout').onclick = () => {
        authManager.logout();
        showNotification('Logged out successfully', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      };

      // demo price map (per-day price). In production store price in DB.
      const pricePerDay = 5; // currency units per day

      async function loadDashboard() {
        try {
          await Promise.all([loadRentals(), loadAvailableBooks()]);
        } catch (error) {
          console.error('Failed to load dashboard data:', error);
          showNotification('Failed to load some data', 'warning');
        }
      }

      async function loadRentals() {
        try {
          const response = await apiRequest('/api/my-rentals');
          if (response.ok) {
            const data = await response.json();
            if (data.success) {
              renderRentals(data.rentals);
            } else {
              throw new Error(data.message || 'Failed to load rentals');
            }
          } else {
            throw new Error('Failed to load rentals');
          }
        } catch (error) {
          console.error('Failed to load rentals:', error);
          document.getElementById('rentals').innerHTML = '<p class="text-gray-500">Failed to load rentals</p>';
        }
      }

      async function loadAvailableBooks() {
        try {
          const response = await fetch('/api/books');
          const data = await response.json();
          renderAvailableBooks(data.books || data);
        } catch (error) {
          console.error('Error loading books:', error);
          document.getElementById('available').innerHTML = `
            <div style="padding: 32px; text-align: center; color: var(--text-muted);">
              <p>Error loading books. Please try again later.</p>
            </div>
          `;
        }
      }

      function renderRentals(rentals) {
        const container = document.getElementById('rentals');
        if (!rentals || rentals.length === 0) {
          container.innerHTML = `
            <div class="card" style="padding: 32px; text-align: center; background: var(--card-bg); border: 2px dashed var(--border-color);">
              <p style="color: var(--accent); font-weight: 600; font-size: 1.1rem;">📚 No books rented yet</p>
              <p style="color: var(--text-muted); margin-top: 8px;">Browse available books below to start reading!</p>
            </div>
          `;
          return;
        }

        container.innerHTML = rentals.map(rental => {
          const expiryDate = new Date(rental.expiry_date);
          const now = new Date();
          const isExpired = rental.isExpired || expiryDate <= now;
          const daysLeft = rental.days_remaining;
          const isExpiringSoon = rental.isExpiringSoon;
          
          let statusBadge, statusColor;
          if (isExpired) {
            statusBadge = 'Expired';
            statusColor = 'background: #fee; color: #c00; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem;';
          } else if (isExpiringSoon) {
            statusBadge = `${daysLeft} day(s) left - Expiring Soon!`;
            statusColor = 'background: #ffc; color: #860; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem;';
          } else {
            statusBadge = `${daysLeft} day(s) remaining`;
            statusColor = 'background: #efe; color: #060; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem;';
          }
          
          return `
            <div class="card" style="padding: 20px;">
              <div style="display: flex; gap: 16px; align-items: start;">
                <img src="${rental.image_url || 'https://via.placeholder.com/80x100'}" 
                     alt="${rental.book_title}" 
                     style="width: 80px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color);">
                <div style="flex: 1;">
                  <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 8px;">${rental.book_title}</h3>
                  <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px;">
                    <span style="display: inline-block; margin-right: 12px;">📚 ${rental.category || 'General'}</span>
                    <span style="display: inline-block;">💰 ৳${rental.total_price} for ${rental.rental_days} days</span>
                  </p>
                  <div style="margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <span style="${statusColor}">
                      ${statusBadge}
                    </span>
                    ${rental.access_count > 0 ? `<span style="font-size: 0.85rem; color: var(--text-muted);">📖 Read ${rental.access_count} times</span>` : ''}
                  </div>
                  <div style="margin-top: 16px; display: flex; justify-content: space-between; align-items: center;">
                    <div style="font-size: 0.85rem; color: var(--text-muted);">
                      <div>Rented: ${formatDate(rental.rental_date)}</div>
                      <div>Expires: ${formatDate(rental.expiry_date)}</div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                      ${!isExpired && (rental.pdf_file || rental.drive_link) ? `
                        <button onclick="readBook('${(rental.book_title||'').replace(/'/g, "\\'")}', ${rental.rental_id}, '${(rental.pdf_file||'').replace(/'/g, "\\'")}', ${rental.book_id}, '${(rental.drive_link||'').replace(/'/g, "\\'")})" 
                                class="btn" style="padding: 10px 20px;">
                          📖 Open ${rental.drive_link ? '(Drive)' : '(Local)'}
                        </button>
                      ` : !isExpired ? `
                        <span class="btn-secondary" style="padding: 10px 20px; opacity: 0.5; cursor: not-allowed;">
                          No File
                        </span>
                      ` : `
                        <span class="btn-secondary" style="padding: 10px 20px; opacity: 0.5; cursor: not-allowed;">
                          Expired
                        </span>
                      `}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderAvailableBooks(books) {
        const container = document.getElementById('available');
        
        if (!books || books.length === 0) {
          container.innerHTML = `
            <div style="padding: 32px; text-align: center; color: var(--text-muted);">
              <p>📚 No books available at the moment.</p>
            </div>
          `;
          return;
        }

        const source = books;

        container.innerHTML = source.map(book => {
          // Format price and meta info from database
          const pricePerDay = book.price_per_day || 15;
          const defaultDays = 7;
          const totalPrice = pricePerDay * defaultDays;
          const priceText = `৳${totalPrice} total • ${defaultDays} days`;
          const meta = book.description || `${book.author || 'Various'} • ৳${pricePerDay}/day`;
          
          return `
          <div class="card">
            <div style="position: relative; overflow: hidden; border-radius: 8px 8px 0 0; background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent) 100%); height: 220px;">
              <img src="${book.image_url || book.image || '/img/logo.png'}" alt="${book.title}" 
                   style="width: 100%; height: 100%; object-fit: cover;" 
                   onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=display:flex;align-items:center;justify-content:center;height:100%;color:white;font-size:3rem>📚</div>'">
            </div>
            <div class="card-body">
              <div style="margin-bottom: 8px;">
                <span class="badge">${book.category || 'General'}</span>
              </div>
              <h3 class="card-title">${book.title}</h3>
              <p class="card-meta">${meta}</p>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
                <span class="card-price">${priceText}</span>
                <button onclick="openSimpleRentModal(${book.id}, '${(book.title||'').replace(/'/g, "\\'")}', '${priceText.replace(/'/g, "\\'")}')" class="btn">
                  Rent Now
                </button>
              </div>
            </div>
          </div>
        `;
        }).join('');
      }

      // Rent modal logic (matching index.html)
      const rentModal = document.getElementById('rentModal');
      const rentDaysInput = document.getElementById('rr_rentDays');
      const rentBookInfo = document.getElementById('rentBookInfo');
      let currentRentBookId = null;

      function openSimpleRentModal(bookId, title, priceText){
        currentRentBookId = bookId;
        rentBookInfo.textContent = title + (priceText ? ' — ' + priceText : '');
        rentDaysInput.value = 1;
        updateRrPricing(priceText);
        rentModal.classList.add('show');
      }

      function closeRentModal(){ 
        currentRentBookId = null; 
        rentModal.classList.remove('show'); 
      }

      function parseBasePriceFromText(priceText) {
        if (!priceText) return 15;
        const m = priceText.match(/৳\s*(\d+)/);
        if (m && m[1]) return parseInt(m[1], 10);
        const n = priceText.match(/(\d+)/);
        return n ? parseInt(n[1], 10) : 15;
      }

      function updateRrPricing(priceTextOverride){
        try {
          const days = Math.max(1, Math.min(30, parseInt(rentDaysInput.value || '1', 10)));
          const priceText = priceTextOverride || (rentBookInfo ? rentBookInfo.textContent : '') || '';
          const basePrice = parseBasePriceFromText(priceText);
          const dailyIncrement = 2;
          const total = basePrice + ((days - 1) * dailyIncrement);
          const totalEl = document.getElementById('rrTotalPrice');
          const breakdownEl = document.getElementById('rrPriceBreakdown');
          if (totalEl) totalEl.textContent = `৳${total}`;
          if (breakdownEl) {
            if (days === 1) {
              breakdownEl.textContent = `Base: ৳${basePrice} for 1 day`;
            } else {
              const extra = (days - 1) * dailyIncrement;
              breakdownEl.innerHTML = `Base: ৳${basePrice} <br>Extra ${days - 1} day(s): ৳${extra} <br><strong>Total: ৳${total}</strong>`;
            }
          }
        } catch (e) {
          console.warn('updateRrPricing error', e);
        }
      }

      if (rentDaysInput) {
        rentDaysInput.addEventListener('input', () => updateRrPricing());
      }

      document.getElementById('rentCancel').addEventListener('click', ()=> closeRentModal());

      document.getElementById('rentConfirm').addEventListener('click', async ()=>{
        const days = parseInt(rentDaysInput.value,10) || 1;
        if (!currentRentBookId) return closeRentModal();
        const token = localStorage.getItem('token') || localStorage.getItem('rr_token');
        if (!token) { 
          showNotification('Please sign in to rent books', 'warning');
          setTimeout(() => window.location.href = '/signin.html', 1500);
          return; 
        }
        try {
          const res = await fetch('/api/rent/rent', {
            method:'POST', 
            headers:{
              'Content-Type':'application/json',
              'Authorization':'Bearer '+token
            }, 
            body: JSON.stringify({bookId: currentRentBookId, days})
          });
          const data = await res.json();
          if (res.ok && data.success) {
            showNotification('Rented successfully — expires in ' + (data.expiresInDays || days) + ' day(s)', 'success');
            closeRentModal();
            await loadDashboard(); // Refresh the dashboard
          } else {
            showNotification(data.error || 'Could not create rental', 'error');
          }
        } catch (err) {
          console.error(err);
          showNotification('Network or server error', 'error');
        }
      });

      // Function to handle reading a book
      async function readBook(bookTitle, rentalId, pdfFile, bookId, driveLink) {
        try {
          // Check if Google Drive link is available first
          if (driveLink) {
            showNotification(`Opening "${bookTitle}" from Google Drive...`, 'info');
            
            // Track access in database (if needed)
            if (rentalId) {
              await apiRequest(`/api/track-access/${rentalId}`, { method: 'POST' });
            }
            
            // Convert Google Drive view link to direct download/preview link
            let directLink = driveLink;
            if (driveLink.includes('drive.google.com/file/d/')) {
              const fileId = driveLink.match(/\/file\/d\/([a-zA-Z0-9-_]+)/)[1];
              directLink = `https://drive.google.com/file/d/${fileId}/preview`;
            }
            
            window.open(directLink, '_blank');
            
            // Refresh rentals to update access count
            setTimeout(() => {
              loadRentals();
            }, 1000);
            
            return;
          }
          
          // Fallback to local PDF file
          if (!pdfFile) {
            showNotification('Book file not available', 'error');
            return;
          }

          showNotification(`Opening "${bookTitle}"...`, 'info');
          
          // Track access in database (if needed)
          if (rentalId) {
            await apiRequest(`/api/track-access/${rentalId}`, { method: 'POST' });
          }
          
          // Open book file in new tab
          const fileUrl = pdfFile.startsWith('http') ? pdfFile : `/storage/books/${pdfFile}`;
          window.open(fileUrl, '_blank');
          
          // Refresh rentals to update access count
          setTimeout(() => {
            loadRentals();
          }, 1000);
          
        } catch (error) {
          console.error('Failed to open book:', error);
          showNotification('Failed to open book', 'error');
        }
      }

      // Helper function for formatting dates
      function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      }

      // Helper function for API requests
      async function apiRequest(url, options = {}) {
        const token = localStorage.getItem('token');
        const defaultOptions = {
          headers: {
            'Content-Type': 'application/json',
            ...(token && { 'Authorization': `Bearer ${token}` })
          }
        };
        
        return fetch(url, { ...defaultOptions, ...options });
      }

      // Notification system
      function showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        notification.style.cssText = `
          position: fixed;
          top: 20px;
          right: 20px;
          padding: 16px 24px;
          background: ${type === 'error' ? '#fee' : type === 'warning' ? '#fff3cd' : type === 'success' ? '#d4edda' : '#d1ecf1'};
          color: ${type === 'error' ? '#c00' : type === 'warning' ? '#856404' : type === 'success' ? '#155724' : '#0c5460'};
          border: 1px solid ${type === 'error' ? '#f5c6cb' : type === 'warning' ? '#ffeeba' : type === 'success' ? '#c3e6cb' : '#bee5eb'};
          border-radius: 8px;
          box-shadow: 0 4px 6px rgba(0,0,0,0.1);
          z-index: 10000;
          font-weight: 500;
          animation: slideIn 0.3s ease;
        `;
        notification.textContent = message;
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.style.animation = 'slideOut 0.3s ease';
          setTimeout(() => notification.remove(), 300);
        }, 3000);
      }

      // Add animations
      const style = document.createElement('style');
      style.textContent = `
        @keyframes slideIn {
          from { transform: translateX(400px); opacity: 0; }
          to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
          from { transform: translateX(0); opacity: 1; }
          to { transform: translateX(400px); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    </script>
  </body>
</html>
